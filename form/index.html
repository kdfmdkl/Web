<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <form action="" method="post" autocomplete="off">
      <label for="username">Username:</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Username"
      /><br /><br />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
      /><br /><br />

      <input type="submit" value="Submit" />
    </form>
    <p>1 Lorem ipsum dolor sit amet.</p>
    <form action="" autocomplete="off">
      <input type="checkbox" name="" id="" /> Red<br />
      <input type="checkbox" name="" id="" /> Yellow<br />
      <input type="checkbox" name="" id="" /> Blue<br />
      <input type="button" value="Click Me" />
    </form>
    <p>2 Lorem ipsum dolor sit amet.</p>
    <form action="" autocomplete="off">
      <input type="radio" name="gender" id="" /> Nam
      <input type="radio" name="gender" id="" /> Nữ<br />
      <input type="button" value="Click Me" />
      <input type="reset" value="Reset" />
      <button>
        <img src="../Filter/img/pikachu.jpg" alt="" />
        Click Me
      </button>
    </form>
    <p>1. Textarea</p>
    <form action="">
      <textarea
        name="message"
        id="message"
        cols="40"
        rows="5"
        placeholder="Enter your message here..."
      ></textarea>
      <br />
      <input type="submit" value="Send Message" />
    </form>
    <p>2.Select</p>
    <form action="" method="post">
      <label for="cars">Choose a car:</label>
      <select name="cars" id="cars" required>
        <option value="">-- Chọn --</option>
        <option value="volvo">Volvo</option>
        <option value="saab">Saab</option>
        <option value="fiat">Fiat</option>
        <option value="audi">Audi</option>
      </select>
      <br /><br />
      <input type="submit" value="Submit" name="cars" />
    </form>
    <p>3.optground</p>
    <form action="">
      <label for="food">Choose a food:</label>
      <select name="food" id="food" required>
        <option value="">-- Chọn --</option>
        <optgroup label="Fruits">
          <option value="pizza">Pizza</option>
          <option value="burger">Burger</option>
          <option value="sushi">Sushi</option>
          <option value="pasta">Pasta</option>
        </optgroup>
        <optgroup label="Vegetables">
          <option value="pizza">Pizza</option>
          <option value="burger">Burger</option>
          <option value="sushi">Sushi</option>
          <option value="pasta">Pasta</option>
        </optgroup>
        <optgroup label="Burger">
          <option value="pizza">Pizza</option>
          <option value="burger">Burger</option>
          <option value="sushi">Sushi</option>
          <option value="pasta">Pasta</option>
        </optgroup>
      </select>
      <br /><br />
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
